{{- include "cc-rc.validateGithubAuth" . -}}
{{- include "cc-rc.validateGitIdentity" . -}}
{{- include "cc-rc.validateRemoteControl" . -}}
{{- $root := . -}}
{{- $proxyURL := printf "http://%s.%s.svc.cluster.local:%v" (include "cc-rc.squidServiceName" .) .Release.Namespace .Values.proxy.service.port -}}
{{- $noProxy := "localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local" -}}
{{- range $repoEntry := .Values.repos }}
{{- $slug := include "cc-rc.repoSlug" $repoEntry }}
{{- $name := printf "%s-%s" (include "cc-rc.fullname" $root) $slug }}
{{- $homeSize := ($repoEntry.storage).homeSize | default $root.Values.storage.homeSize }}
{{- $workspaceSize := ($repoEntry.storage).workspaceSize | default $root.Values.storage.workspaceSize }}
{{- $resources := mergeOverwrite (deepCopy $root.Values.resources) ($repoEntry.resources | default dict) }}
{{- $rc := $repoEntry.remoteControl | default dict }}
{{- $rcPermissionMode := $rc.permissionMode | default $root.Values.remoteControl.permissionMode }}
{{- $rcSpawn := $rc.spawn | default $root.Values.remoteControl.spawn }}
{{- $rcCapacity := $rc.capacity | default $root.Values.remoteControl.capacity }}
{{- $rcName := $rc.name | default "" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "cc-rc.labels" $root | nindent 4 }}
    app.kubernetes.io/component: agent
    cc-rc.io/org: {{ $repoEntry.org | quote }}
    cc-rc.io/repo: {{ $repoEntry.repo | quote }}
spec:
  clusterIP: None
  selector:
    {{- include "cc-rc.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: agent
    cc-rc.io/org: {{ $repoEntry.org | quote }}
    cc-rc.io/repo: {{ $repoEntry.repo | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "cc-rc.labels" $root | nindent 4 }}
    app.kubernetes.io/component: agent
    cc-rc.io/org: {{ $repoEntry.org | quote }}
    cc-rc.io/repo: {{ $repoEntry.repo | quote }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "cc-rc.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: agent
      cc-rc.io/org: {{ $repoEntry.org | quote }}
      cc-rc.io/repo: {{ $repoEntry.repo | quote }}
  template:
    metadata:
      labels:
        {{- include "cc-rc.labels" $root | nindent 8 }}
        app.kubernetes.io/component: agent
        cc-rc.io/org: {{ $repoEntry.org | quote }}
        cc-rc.io/repo: {{ $repoEntry.repo | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: {{ $root.Values.podFsGroup }}
      initContainers:
        - name: seed-home
          # Mounted at a path other than /home/dev, so the image's baked-in
          # home dir (e.g. ~/.claude/settings.json) stays visible here and
          # can be copied onto the home PVC - unlike the agent container,
          # where the PVC is mounted directly at /home/dev and shadows it.
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # ~/.claude/: overwrite from image, never delete extras
              # (claude's own state/credentials survive; --ignore-times
              # forces the overwrite even on a size+mtime match).
              # Everywhere else: full reset via --delete, except ~/.cc-rc/
              # (our login-complete marker - must survive every boot).
              # --no-owner --no-group: non-root can't chown/chgrp anyway
              # (EPERM even on the PVC mountpoint itself); fsGroup already
              # handles the PVC's group ownership.
              mkdir -p /home/dev/.claude /mnt/home-pvc/.claude
              rsync -a --no-times --no-owner --no-group --ignore-times \
                /home/dev/.claude/. /mnt/home-pvc/.claude/
              rsync -a --delete --no-times --no-owner --no-group \
                --exclude=.claude --exclude=.cc-rc \
                /home/dev/. /mnt/home-pvc/
          volumeMounts:
            - name: home
              mountPath: /mnt/home-pvc
        - name: clone-repo
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              DEST="/workspace/repo"
              if [ -d "$DEST/.git" ]; then
                echo "Already cloned at $DEST, skipping."
              else
                git clone "https://x-access-token:${GH_TOKEN}@github.com/{{ $repoEntry.org }}/{{ $repoEntry.repo }}.git" "$DEST"
              fi
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cc-rc.githubSecretName" $root }}
                  key: {{ include "cc-rc.githubSecretKey" $root }}
            - name: HTTP_PROXY
              value: {{ $proxyURL | quote }}
            - name: HTTPS_PROXY
              value: {{ $proxyURL | quote }}
            - name: http_proxy
              value: {{ $proxyURL | quote }}
            - name: https_proxy
              value: {{ $proxyURL | quote }}
            - name: NO_PROXY
              value: {{ $noProxy | quote }}
            - name: no_proxy
              value: {{ $noProxy | quote }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: gitconfig
              mountPath: /home/dev/.gitconfig
              subPath: .gitconfig
            - name: gitconfig
              mountPath: /home/dev/.gitignore_global
              subPath: .gitignore_global
      containers:
        - name: agent
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              MARKER_DIR="/home/dev/.cc-rc"
              MARKER="$MARKER_DIR/login-complete"
              mkdir -p "$MARKER_DIR"

              is_remote_control_running() {
                pgrep -f "claude remote-control" >/dev/null 2>&1
              }

              if [ ! -f "$MARKER" ]; then
                echo "No login marker at $MARKER - starting first-time claude login setup."
                echo "Attach with: kubectl exec -it \$(hostname) -- screen -r claude-login"
                echo "Then run /login, and once logged in, run: claude remote-control"
                screen -dmS claude-login bash -lic 'claude --no-chrome'

                echo "Waiting for 'claude remote-control' to be started inside that session..."
                while ! is_remote_control_running; do
                  sleep 5
                done

                echo "Detected claude remote-control running - marking login complete."
                touch "$MARKER"
                echo "Exiting so the pod restarts into steady-state mode."
                exit 0
              fi

              NAME="${RC_NAME:-$(hostname)}"
              echo "Login already complete - starting claude remote-control (name=$NAME)."
              screen -dmS remote-control bash -lic "claude remote-control --name ${NAME} --permission-mode ${RC_PERMISSION_MODE} --spawn ${RC_SPAWN} --capacity ${RC_CAPACITY}"

              down_since=0
              while true; do
                if is_remote_control_running; then
                  down_since=0
                else
                  now=$(date +%s)
                  if [ "$down_since" -eq 0 ]; then
                    down_since=$now
                  fi
                  elapsed=$(( now - down_since ))
                  if [ "$elapsed" -ge 45 ]; then
                    echo "claude remote-control has not been running for 45s - exiting."
                    exit 1
                  fi
                fi
                sleep 5
              done
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cc-rc.githubSecretName" $root }}
                  key: {{ include "cc-rc.githubSecretKey" $root }}
            - name: HTTP_PROXY
              value: {{ $proxyURL | quote }}
            - name: HTTPS_PROXY
              value: {{ $proxyURL | quote }}
            - name: http_proxy
              value: {{ $proxyURL | quote }}
            - name: https_proxy
              value: {{ $proxyURL | quote }}
            - name: NO_PROXY
              value: {{ $noProxy | quote }}
            - name: no_proxy
              value: {{ $noProxy | quote }}
            - name: RC_NAME
              value: {{ $rcName | quote }}
            - name: RC_PERMISSION_MODE
              value: {{ $rcPermissionMode | quote }}
            - name: RC_SPAWN
              value: {{ $rcSpawn | quote }}
            - name: RC_CAPACITY
              value: {{ $rcCapacity | quote }}
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "claude remote-control"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: home
              mountPath: /home/dev
            - name: workspace
              mountPath: /workspace
            - name: gitconfig
              mountPath: /home/dev/.gitconfig
              subPath: .gitconfig
            - name: gitconfig
              mountPath: /home/dev/.gitignore_global
              subPath: .gitignore_global
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: gitconfig
          configMap:
            name: {{ include "cc-rc.fullname" $root }}-gitconfig
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $root.Values.storage.storageClassName }}
        storageClassName: {{ $root.Values.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ $homeSize }}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $root.Values.storage.storageClassName }}
        storageClassName: {{ $root.Values.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ $workspaceSize }}
{{- end }}
