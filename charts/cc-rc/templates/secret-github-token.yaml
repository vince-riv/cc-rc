{{- include "cc-rc.validateGithubAuth" . -}}
{{- if .Values.github.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cc-rc.githubSecretName" . }}
  labels:
    {{- include "cc-rc.labels" . | nindent 4 }}
  annotations:
    # A hook (rather than a normal resource), and weighted ahead of the
    # sshKey Job below, so GH_TOKEN is guaranteed to exist by the time that
    # Job runs - hooks all run before normal manifests, but only hook weight
    # orders hooks against each other. before-hook-creation lets this
    # re-create cleanly on every install/upgrade instead of erroring on an
    # already-exists Secret (hooks are created, not applied).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ .Values.github.secretKey }}: {{ .Values.github.token | quote }}
{{- end }}
