{{- $blockedDomains := list -}}
{{- $blockedCidrs := list -}}
{{- range .Values.proxy.defaultBlocked -}}
  {{- if contains "/" . -}}
    {{- $blockedCidrs = append $blockedCidrs . -}}
  {{- else -}}
    {{- $blockedDomains = append $blockedDomains . -}}
  {{- end -}}
{{- end -}}
{{- $exceptDomains := list -}}
{{- $exceptCidrs := list -}}
{{- range .Values.proxy.defaultBlockedExceptions -}}
  {{- if contains "/" . -}}
    {{- $exceptCidrs = append $exceptCidrs . -}}
  {{- else -}}
    {{- $exceptDomains = append $exceptDomains . -}}
  {{- end -}}
{{- end -}}
{{- $denyDomains := list -}}
{{- $denyCidrs := list -}}
{{- range .Values.proxy.denyList -}}
  {{- if contains "/" . -}}
    {{- $denyCidrs = append $denyCidrs . -}}
  {{- else -}}
    {{- $denyDomains = append $denyDomains . -}}
  {{- end -}}
{{- end -}}
{{- $allowDomains := list -}}
{{- $allowCidrs := list -}}
{{- range .Values.proxy.allowList -}}
  {{- if contains "/" . -}}
    {{- $allowCidrs = append $allowCidrs . -}}
  {{- else -}}
    {{- $allowDomains = append $allowDomains . -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cc-rc.fullname" . }}-squid-config
  labels:
    {{- include "cc-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
data:
  squid.conf: |
    http_port {{ .Values.proxy.service.port }}
    visible_hostname squid
    coredump_dir /var/spool/squid
    {{- if gt (int .Values.proxy.gracefulShutdownSeconds) 0 }}
    # Keep serving already-open connections this long on shutdown instead
    # of dropping them - see proxy.gracefulShutdownSeconds in values.yaml.
    # Requires deployment-squid.yaml's kill-delay/terminationGracePeriodSeconds
    # to actually give kubelet/pebble that long.
    shutdown_lifetime {{ .Values.proxy.gracefulShutdownSeconds }} seconds
    {{- end }}
    # Default access_log/cache_log write to files inside the container,
    # invisible to `kubectl logs`/stern - redirect both to stdout instead.
    #
    # kubelet's tcpSocket probes log as NONE_NONE/000
    # error:transaction-end-before-headers. Verified against the real 7.2
    # binary this can't be filtered by an access_log ACL - no ACL type gets
    # enough context to match a zero-data transaction, so it always falls
    # through and logs anyway. Don't add one back without testing first.
    access_log stdio:/dev/stdout squid
    cache_log /dev/stdout
    refresh_pattern ^ftp:           1440    20%     10080
    refresh_pattern ^gopher:        1440    0%      1440
    refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
    refresh_pattern .                0      20%     4320

    acl CONNECT method CONNECT
    acl SSL_ports port 443
    acl SSL_ports port 22
    {{- range .Values.proxy.allowedPortsWhenOpen }}
    {{- if ne (toString .) "443" }}
    acl SSL_ports port {{ . }}
    {{- end }}
    {{- end }}
    acl Safe_ports port 80
    acl Safe_ports port 443
    acl Safe_ports port 22
    {{- range .Values.proxy.allowedPortsWhenOpen }}
    acl Safe_ports port {{ . }}
    {{- end }}

    #
    # ACL precedence (evaluated top to bottom, first match wins):
    #   1. protocol/port sanity
    #   2. baked-in defaultBlocked destinations — denied, unless the
    #      destination is in defaultBlockedExceptions
    #   3. user-supplied denyList — always denied, exceptions or not
    #   4. github.com:22 (git+ssh, see files/scripts/seed-ssh.sh's
    #      ~/.ssh/config - agents tunnel git+ssh through squid via
    #      ProxyCommand/CONNECT) — always allowed, in both modes, unless
    #      denyList already denied it above
    #   5. allow-list-or-open-web logic, then deny everything else
    #

    # -- 1. protocol/port sanity --
    http_access deny CONNECT !SSL_ports
    http_access deny !Safe_ports

    # -- 2. baked-in defaultBlocked destinations, denied unless exempted --
    # Each exemption ACL is negated onto BOTH deny lines, so a domain exemption
    # also covers the private address that name resolves to, and a CIDR
    # exemption also covers names (e.g. *.svc.cluster.local) resolving into it.
    {{- $exempt := "" }}
    {{- if $exceptDomains }}
    # -n: match by requested name only - never reverse-DNS a raw-IP request
    # into an exempted name.
    acl default_blocked_except_domains dstdomain -n {{ $exceptDomains | join " " }}
    {{- $exempt = printf "%s !default_blocked_except_domains" $exempt }}
    {{- end }}
    {{- if $exceptCidrs }}
    acl default_blocked_except_cidrs dst {{ $exceptCidrs | join " " }}
    {{- $exempt = printf "%s !default_blocked_except_cidrs" $exempt }}
    {{- end }}
    {{- if $blockedDomains }}
    # -n: no reverse DNS of raw-IP requests. A slow PTR lookup otherwise stalls
    # the first request to an IP for seconds, and private IPs are already
    # caught by the CIDR deny line below.
    acl default_blocked_domains dstdomain -n {{ $blockedDomains | join " " }}
    http_access deny default_blocked_domains{{ $exempt }}
    {{- end }}
    {{- if $blockedCidrs }}
    acl default_blocked_cidrs dst {{ $blockedCidrs | join " " }}
    http_access deny default_blocked_cidrs{{ $exempt }}
    {{- end }}

    # -- 3. user-supplied denyList, always denied --
    {{- if $denyDomains }}
    acl user_deny_domains dstdomain -n {{ $denyDomains | join " " }}
    http_access deny user_deny_domains
    {{- end }}
    {{- if $denyCidrs }}
    acl user_deny_cidrs dst {{ $denyCidrs | join " " }}
    http_access deny user_deny_cidrs
    {{- end }}

    # -- 4. github.com:22 (git+ssh), always allowed --
    # Every dstdomain ACL here uses -n: without it, squid matches a raw-IP
    # request against the IP's reverse DNS name, which whoever owns that IP
    # controls - e.g. a PTR of "github.com" would open that IP's port 22.
    acl github_ssh dstdomain -n github.com
    acl port_22 port 22
    http_access allow github_ssh port_22

    # -- 5. allow-list-or-open-web logic --
    {{- if .Values.proxy.allowList }}
    # Strict allow-list mode: only these destinations, on ports 80/443.
    acl allowed_ports port 80
    acl allowed_ports port 443
    {{- if $allowDomains }}
    acl allow_domains dstdomain -n {{ $allowDomains | join " " }}
    http_access allow allow_domains allowed_ports
    {{- end }}
    {{- if $allowCidrs }}
    acl allow_cidrs dst {{ $allowCidrs | join " " }}
    http_access allow allow_cidrs allowed_ports
    {{- end }}
    http_access deny all
    {{- else }}
    # Open-web mode: allow everything not already denied, on the configured
    # ports.
    acl open_ports port {{ .Values.proxy.allowedPortsWhenOpen | join " " }}
    http_access allow open_ports
    http_access deny all
    {{- end }}
  {{- if gt (int .Values.proxy.gracefulShutdownSeconds) 0 }}
  # Pebble (this image's PID 1, see deployment-squid.yaml) kills its squid
  # service 5s after SIGTERM by default (its "kill-delay") - shorter than
  # shutdown_lifetime above, so squid would get SIGKILLed mid-drain without
  # this override. "override: merge" layers this on top of the image's own
  # baked-in 001-rockcraft-squid.yaml rather than replacing it.
  pebble-kill-delay.yaml: |
    services:
      squid:
        override: merge
        kill-delay: {{ add (int .Values.proxy.gracefulShutdownSeconds) 10 }}s
  {{- end }}
