apiVersion: v1
kind: Service
metadata:
  name: {{ include "cc-rc.squidServiceName" . }}
  labels:
    {{- include "cc-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ .Values.proxy.service.type }}
  selector:
    {{- include "cc-rc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: squid
      port: {{ .Values.proxy.service.port }}
      targetPort: squid
      protocol: TCP
