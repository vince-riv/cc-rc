apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cc-rc.fullname" . }}-squid
  labels:
    {{- include "cc-rc.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  revisionHistoryLimit: {{ .Values.proxy.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "cc-rc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-squid.yaml") . | sha256sum }}
      labels:
        {{- include "cc-rc.labels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      automountServiceAccountToken: false
      {{- if gt (int .Values.proxy.gracefulShutdownSeconds) 0 }}
      # Must outlast squid.conf's shutdown_lifetime and the pebble
      # kill-delay override below, or kubelet SIGKILLs mid-drain.
      terminationGracePeriodSeconds: {{ add (int .Values.proxy.gracefulShutdownSeconds) 15 }}
      {{- end }}
      {{- with .Values.proxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.proxy.affinity }}
      affinity:
        {{- toYaml .Values.proxy.affinity | nindent 8 }}
      {{- else if gt (int .Values.proxy.replicaCount) 1 }}
      affinity:
        {{- include "cc-rc.squidAntiAffinity" . | nindent 8 }}
      {{- end }}
      {{- with .Values.proxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: squid
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          # No command/args override: this Canonical "rock" image's
          # ENTRYPOINT is `pebble enter`, which already starts squid via a
          # baked-in service layer. Args here would go to `pebble enter`
          # instead and crashloop.
          env:
            # Pebble (PID 1) only relays service output to its own stdout
            # (what `kubectl logs`/stern show) when verbose.
            - name: PEBBLE_VERBOSE
              value: "1"
          ports:
            - name: squid
              containerPort: {{ .Values.proxy.service.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: squid
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            {{- if .Values.proxy.probes.quiet }}
            # tcpSocket logs a NONE_NONE/000 error on every check (squid
            # sees a connect-then-disconnect). Check for a LISTEN socket
            # directly instead, so squid never sees the probe.
            exec:
              command:
                - sh
                - -c
                - awk -v p={{ printf "%04X" (int .Values.proxy.service.port) }} 'BEGIN{ok=0} FNR>1{split($2,a,":"); if (a[2]==p && $4=="0A") ok=1} END{exit !ok}' /proc/net/tcp /proc/net/tcp6
            {{- else }}
            tcpSocket:
              port: squid
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            {{- if .Values.proxy.probes.quiet }}
            exec:
              command:
                - sh
                - -c
                - awk -v p={{ printf "%04X" (int .Values.proxy.service.port) }} 'BEGIN{ok=0} FNR>1{split($2,a,":"); if (a[2]==p && $4=="0A") ok=1} END{exit !ok}' /proc/net/tcp /proc/net/tcp6
            {{- else }}
            tcpSocket:
              port: squid
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: squid-config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
            {{- if gt (int .Values.proxy.gracefulShutdownSeconds) 0 }}
            - name: squid-config
              # Layer files load in filename order, so 002 applies after
              # the image's baked-in 001-rockcraft-squid.yaml.
              mountPath: /var/lib/pebble/default/layers/002-cc-rc-kill-delay.yaml
              subPath: pebble-kill-delay.yaml
            {{- end }}
          {{- with .Values.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: squid-config
          configMap:
            name: {{ include "cc-rc.fullname" . }}-squid-config
