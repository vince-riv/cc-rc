suite: GH_TOKEN secret (happy path)
templates:
  - secret-github-token.yaml
set:
  git:
    name: CI Bot
    email: ci@example.com
  repos:
    - org: myorg
      repo: myrepo
tests:
  - it: creates a Secret with the token when github.token is set
    set:
      github.token: my-pat
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: cc-rc-github-token
      - equal:
          path: stringData.token
          value: my-pat

  - it: creates the Secret under a custom name/key
    set:
      github:
        token: my-pat
        secretName: custom-secret
        secretKey: pat
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret
      - equal:
          path: stringData.pat
          value: my-pat

  - it: renders no Secret when using an existing one instead
    set:
      github:
        token: ""
        existingSecret: pre-provisioned-secret
    asserts:
      - hasDocuments:
          count: 0
