suite: GH_TOKEN secret (happy path)
templates:
  - secret-github-tokens.yaml
set:
  git:
    name: CI Bot
    email: ci@example.com
  repos:
    - org: myorg
      repo: myrepo
tests:
  - it: creates a Secret with one key per org when github.tokens is set
    set:
      github.tokens:
        myorg: my-pat
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-github-tokens
      - equal:
          path: stringData.myorg
          value: my-pat

  - it: creates the Secret under a custom name, with one key per org, for multiple orgs
    set:
      github:
        tokens:
          myorg: my-pat
          otherorg: other-pat
        secretName: custom-secret
      repos:
        - org: myorg
          repo: myrepo
        - org: otherorg
          repo: otherrepo
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret
      - equal:
          path: stringData.myorg
          value: my-pat
      - equal:
          path: stringData.otherorg
          value: other-pat

  - it: renders no Secret when using an existing one instead
    set:
      github:
        tokens: {}
        existingSecret: pre-provisioned-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when github.tokens is missing an entry for a repos[] org
    set:
      github:
        tokens:
          myorg: my-pat
      repos:
        - org: myorg
          repo: myrepo
        - org: otherorg
          repo: otherrepo
    asserts:
      - failedTemplate:
          errorMessageRegex: 'github.tokens has no entry for org "otherorg"'

  - it: fails when both github.tokens and github.existingSecret are set
    set:
      github:
        tokens:
          myorg: my-pat
        existingSecret: some-secret
    asserts:
      - failedTemplate:
          errorMessageRegex: "github.tokens and github.existingSecret are mutually exclusive"

  - it: fails when neither github.tokens nor github.existingSecret is set
    set:
      github:
        tokens: {}
        existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessageRegex: "one of github.tokens or github.existingSecret must be set"
