suite: per-repo agent StatefulSet (happy path)
templates:
  - statefulset-repo.yaml
  - configmap-scripts.yaml
set:
  # Covers every org used across this file's individual tests' repos[]
  # overrides (github.tokens must have an entry for each).
  github:
    tokens:
      MyOrg: dummy-token
      myorg: dummy-token
      alpha: dummy-token
      beta: dummy-token
  git:
    name: CI Bot
    email: ci@example.com
tests:
  - it: renders a headless Service and a StatefulSet named after the org/repo slug
    template: statefulset-repo.yaml
    set:
      repos:
        - org: MyOrg
          repo: My_Repo!
    asserts:
      - documentIndex: 0
        isKind:
          of: Service
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-myorg-my-repo
      - documentIndex: 0
        equal:
          path: spec.clusterIP
          value: None
      - documentIndex: 1
        isKind:
          of: StatefulSet
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-myorg-my-repo
      - documentIndex: 1
        equal:
          path: spec.replicas
          value: 1
      - documentIndex: 1
        equal:
          path: spec.serviceName
          value: RELEASE-NAME-cc-rc-myorg-my-repo
      - documentIndex: 1
        equal:
          path: metadata.labels["cc-rc.io/org"]
          value: MyOrg
      - documentIndex: 1
        equal:
          path: metadata.labels["cc-rc.io/repo"]
          value: My_Repo!

  - it: defaults revisionHistoryLimit to 5
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.revisionHistoryLimit
          value: 5

  - it: revisionHistoryLimit overrides the default for all per-repo StatefulSets
    template: statefulset-repo.yaml
    set:
      revisionHistoryLimit: 2
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.revisionHistoryLimit
          value: 2

  - it: uses default PVC sizes when a repo doesn't override storage
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: home
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[1].metadata.name
          value: workspace
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[1].spec.resources.requests.storage
          value: 5Gi

  - it: a repo can override PVC sizes
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
          storage:
            homeSize: 1Gi
            workspaceSize: 20Gi
    asserts:
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 1Gi
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[1].spec.resources.requests.storage
          value: 20Gi

  - it: mounts a sized emptyDir at /tmp on the agent container, using the default size
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - documentIndex: 1
        contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 2Gi

  - it: a repo can override the /tmp emptyDir size
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
          storage:
            tmpSize: 500Mi
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 500Mi

  - it: applies the default resources to the agent container when no repo override is set
    template: statefulset-repo.yaml
    set:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"

  - it: a repo can override just cpu, keeping the default memory
    template: statefulset-repo.yaml
    set:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
      repos:
        - org: myorg
          repo: myrepo
          resources:
            requests:
              cpu: "2"
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "2"
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi

  - it: a repo can fully override resources independently of the chart default
    template: statefulset-repo.yaml
    set:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
      repos:
        - org: alpha
          repo: one
        - org: beta
          repo: two
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 8Gi

  - it: wires proxy env vars and GH_TOKEN into the agent container (clone-repo no longer needs either - it clones over SSH)
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://RELEASE-NAME-cc-rc-squid.NAMESPACE.svc.cluster.local:3128
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-cc-rc-github-tokens
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: myorg
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NO_PROXY
            value: localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local,.anthropic.com,claude.ai,.claude.ai
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[2].env
          value:
            - name: REPO_ORG
              value: myorg
            - name: REPO_NAME
              value: myrepo

  - it: no nodeSelector/affinity by default
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        notExists:
          path: spec.template.spec.nodeSelector
      - documentIndex: 1
        notExists:
          path: spec.template.spec.affinity

  - it: applies the top-level nodeSelector/affinity defaults to every repo's StatefulSet
    template: statefulset-repo.yaml
    set:
      nodeSelector:
        disktype: ssd
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
      repos:
        - org: alpha
          repo: one
        - org: beta
          repo: two
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
      - documentIndex: 1
        equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: kubernetes.io/arch
      - documentIndex: 3
        equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  - it: a repo's nodeSelector/affinity/tolerations fully replaces the top-level default, not merges with it
    template: statefulset-repo.yaml
    set:
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: default-taint
          operator: Exists
      repos:
        - org: myorg
          repo: myrepo
          nodeSelector:
            gpu: "true"
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values: ["arm64"]
          tolerations:
            - key: gpu
              operator: Exists
              effect: NoSchedule
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.nodeSelector.gpu
          value: "true"
      - documentIndex: 1
        notExists:
          path: spec.template.spec.nodeSelector.disktype
      - documentIndex: 1
        equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: arm64
      - documentIndex: 1
        equal:
          path: spec.template.spec.tolerations
          value:
            - key: gpu
              operator: Exists
              effect: NoSchedule

  - it: mounts the home and workspace PVCs at the expected paths
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: home
            mountPath: /home/dev
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspace
            mountPath: /workspace

  - it: seeds the home PVC and ~/.ssh via the mounted scripts, before cloning the repo
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[0].name
          value: seed-home
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[0].command
          value: ["/bin/bash", "/opt/cc-rc/scripts/seed-home.sh"]
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: home
            mountPath: /mnt/home-pvc
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: scripts
            mountPath: /opt/cc-rc/scripts
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[1].name
          value: seed-ssh
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[1].command
          value: ["/bin/bash", "/opt/cc-rc/scripts/seed-ssh.sh"]
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: ssh-key
            mountPath: /mnt/ssh-key
            readOnly: true
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: SQUID_HOST
            value: RELEASE-NAME-cc-rc-squid.NAMESPACE.svc.cluster.local
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: SQUID_PORT
            value: "3128"
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[2].name
          value: clone-repo
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[2].command
          value: ["/bin/bash", "/opt/cc-rc/scripts/clone-repo.sh"]
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[2].env
          content:
            name: REPO_ORG
            value: myorg
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[2].env
          content:
            name: REPO_NAME
            value: myrepo

  - it: mounts the ssh-key Secret into the container spec
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.volumes
          content:
            name: ssh-key
            secret:
              secretName: RELEASE-NAME-cc-rc-ssh-key

  - it: mounts the gitconfig ConfigMap into the clone-repo init container and the agent container
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[2].volumeMounts
          content:
            name: gitconfig
            mountPath: /home/dev/.gitconfig
            subPath: .gitconfig
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitconfig
            mountPath: /home/dev/.gitconfig
            subPath: .gitconfig
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitconfig
            mountPath: /home/dev/.gitignore_global
            subPath: .gitignore_global
      - documentIndex: 1
        contains:
          path: spec.template.spec.volumes
          content:
            name: gitconfig
            configMap:
              name: RELEASE-NAME-cc-rc-gitconfig

  - it: renders one StatefulSet per repo entry
    template: statefulset-repo.yaml
    set:
      repos:
        - org: alpha
          repo: one
        - org: beta
          repo: two
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-alpha-one
      - documentIndex: 3
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-beta-two

  - it: uses an existing GH_TOKEN secret when github.existingSecret is set, keyed by org
    template: statefulset-repo.yaml
    set:
      github:
        tokens: null
        existingSecret: my-existing-secret
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-existing-secret
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: myorg

  - it: has a readiness probe that checks for a running claude remote-control process, and no livenessProbe
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["pgrep", "-f", "claude remote-control"]
      - documentIndex: 1
        # Deliberately no livenessProbe: it would kill the container on
        # kubelet's own schedule, bypassing RC_UNHEALTHY_TIMEOUT - the
        # script manages its own exit-on-unhealthy instead.
        notExists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: the agent container runs the mounted entrypoint script, with the scripts volume mounted
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].command
          value: ["/bin/bash", "/opt/cc-rc/scripts/agent-entrypoint.sh"]
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: scripts
            mountPath: /opt/cc-rc/scripts
      - documentIndex: 1
        contains:
          path: spec.template.spec.volumes
          content:
            name: scripts
            configMap:
              name: RELEASE-NAME-cc-rc-scripts

  - it: passes the default remote-control settings as env vars, with no name override
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_NAME
            value: ""
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_PERMISSION_MODE
            value: "bypassPermissions"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_SPAWN
            value: "worktree"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_CAPACITY
            value: "8"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_UNHEALTHY_TIMEOUT
            value: "45"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_FIRST_BOOT_TIMEOUT
            value: "900"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_WORKTREE_MAX_AGE_DAYS
            value: "10"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_SHUTDOWN_WAIT
            # terminationGracePeriodSeconds (60, chart default) minus a 5s buffer.
            value: "55"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROMPT_COMMAND
            value: "source /opt/cc-rc/scripts/bash-prompt-hook.sh"
      - documentIndex: 1
        equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: a repo can override remote-control name/permissionMode/spawn/capacity/unhealthyTimeoutSeconds/firstBootTimeoutSeconds/worktreeMaxAgeDays independently of the chart default
    template: statefulset-repo.yaml
    set:
      remoteControl:
        permissionMode: plan
        spawn: session
        capacity: 4
      terminationGracePeriodSeconds: 120
      repos:
        - org: myorg
          repo: myrepo
          remoteControl:
            name: custom-name
            capacity: 12
            unhealthyTimeoutSeconds: 300
            firstBootTimeoutSeconds: 1800
            worktreeMaxAgeDays: 3
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_NAME
            value: "custom-name"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_PERMISSION_MODE
            value: "plan"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_SPAWN
            value: "session"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_CAPACITY
            value: "12"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_UNHEALTHY_TIMEOUT
            value: "300"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_FIRST_BOOT_TIMEOUT
            value: "1800"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_WORKTREE_MAX_AGE_DAYS
            value: "3"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_SHUTDOWN_WAIT
            # terminationGracePeriodSeconds (120, overridden above) minus a 5s buffer.
            value: "115"
      - documentIndex: 1
        equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: fails when remoteControl.permissionMode is not a recognized value
    template: statefulset-repo.yaml
    set:
      remoteControl:
        permissionMode: not-a-real-mode
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - failedTemplate:
          errorMessageRegex: "remoteControl.permissionMode must be one of"

  - it: fails when remoteControl.spawn is not a recognized value
    template: statefulset-repo.yaml
    set:
      remoteControl:
        spawn: not-a-real-mode
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - failedTemplate:
          errorMessageRegex: "remoteControl.spawn must be one of"

  - it: fails when a repo's remoteControl.permissionMode override is not a recognized value
    template: statefulset-repo.yaml
    set:
      repos:
        - org: myorg
          repo: myrepo
          remoteControl:
            permissionMode: not-a-real-mode
    asserts:
      - failedTemplate:
          errorMessageRegex: "repos\\[\\].remoteControl.permissionMode must be one of"
