suite: per-repo agent StatefulSet (happy path)
templates:
  - statefulset-repo.yaml
set:
  github.token: dummy-token
  git:
    name: CI Bot
    email: ci@example.com
tests:
  - it: renders a headless Service and a StatefulSet named after the org/repo slug
    set:
      repos:
        - org: MyOrg
          repo: My_Repo!
    asserts:
      - documentIndex: 0
        isKind:
          of: Service
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-myorg-my-repo
      - documentIndex: 0
        equal:
          path: spec.clusterIP
          value: None
      - documentIndex: 1
        isKind:
          of: StatefulSet
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-myorg-my-repo
      - documentIndex: 1
        equal:
          path: spec.replicas
          value: 1
      - documentIndex: 1
        equal:
          path: spec.serviceName
          value: RELEASE-NAME-cc-rc-myorg-my-repo
      - documentIndex: 1
        equal:
          path: metadata.labels["cc-rc.io/org"]
          value: MyOrg
      - documentIndex: 1
        equal:
          path: metadata.labels["cc-rc.io/repo"]
          value: My_Repo!

  - it: uses default PVC sizes when a repo doesn't override storage
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: home
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 5Gi
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[1].metadata.name
          value: workspace
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[1].spec.resources.requests.storage
          value: 5Gi

  - it: a repo can override PVC sizes
    set:
      repos:
        - org: myorg
          repo: myrepo
          storage:
            homeSize: 1Gi
            workspaceSize: 20Gi
    asserts:
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 1Gi
      - documentIndex: 1
        equal:
          path: spec.volumeClaimTemplates[1].spec.resources.requests.storage
          value: 20Gi

  - it: applies the default resources to the agent container when no repo override is set
    set:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "1"

  - it: a repo can override just cpu, keeping the default memory
    set:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
      repos:
        - org: myorg
          repo: myrepo
          resources:
            requests:
              cpu: "2"
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "2"
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi

  - it: a repo can fully override resources independently of the chart default
    set:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
      repos:
        - org: alpha
          repo: one
        - org: beta
          repo: two
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 8Gi

  - it: wires proxy env vars and GH_TOKEN into both the clone-repo init container and the agent container
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[1].env
          content:
            name: HTTPS_PROXY
            value: http://RELEASE-NAME-cc-rc-squid.NAMESPACE.svc.cluster.local:3128
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HTTPS_PROXY
            value: http://RELEASE-NAME-cc-rc-squid.NAMESPACE.svc.cluster.local:3128
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: cc-rc-github-token
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: token

  - it: mounts the home and workspace PVCs at the expected paths
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: home
            mountPath: /home/dev
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: workspace
            mountPath: /workspace

  - it: seeds the home PVC from the image's home dir without touching /home/dev directly
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[0].name
          value: seed-home
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: "rsync -a --no-times --no-owner --no-group --no-perms --ignore-times"
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: "/home/dev/\\.claude/\\. /mnt/home-pvc/\\.claude/"
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: "rsync -a --delete --no-times --no-owner --no-group --no-perms"
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: "--exclude=\\.claude --exclude=\\.cc-rc"
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: home
            mountPath: /mnt/home-pvc
      - documentIndex: 1
        equal:
          path: spec.template.spec.initContainers[1].name
          value: clone-repo

  - it: mounts the gitconfig ConfigMap into the clone-repo init container and the agent container
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: gitconfig
            mountPath: /home/dev/.gitconfig
            subPath: .gitconfig
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitconfig
            mountPath: /home/dev/.gitconfig
            subPath: .gitconfig
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitconfig
            mountPath: /home/dev/.gitignore_global
            subPath: .gitignore_global
      - documentIndex: 1
        contains:
          path: spec.template.spec.volumes
          content:
            name: gitconfig
            configMap:
              name: RELEASE-NAME-cc-rc-gitconfig

  - it: renders one StatefulSet per repo entry
    set:
      repos:
        - org: alpha
          repo: one
        - org: beta
          repo: two
    asserts:
      - documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-alpha-one
      - documentIndex: 3
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-beta-two

  - it: uses an existing GH_TOKEN secret when github.existingSecret is set
    set:
      github:
        token: ""
        existingSecret: my-existing-secret
        existingSecretKey: gh-pat
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-existing-secret
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: gh-pat

  - it: has a readiness probe that checks for a running claude remote-control process
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["pgrep", "-f", "claude remote-control"]

  - it: the agent bootstrap script checks a login-complete marker, waits for remote-control, then exits
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "MARKER=\"\\$MARKER_DIR/login-complete\""
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "screen -dmS claude-login bash -lic 'claude --no-chrome'"
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "touch \"\\$MARKER\""
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "screen -dmS remote-control bash -lic \"claude remote-control --name \\$\\{NAME\\} --permission-mode \\$\\{RC_PERMISSION_MODE\\} --spawn \\$\\{RC_SPAWN\\} --capacity \\$\\{RC_CAPACITY\\}\""
      - documentIndex: 1
        matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-ge 45 \]; then'

  - it: passes the default remote-control settings as env vars, with no name override
    set:
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_NAME
            value: ""
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_PERMISSION_MODE
            value: "bypassPermissions"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_SPAWN
            value: "worktree"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_CAPACITY
            value: "8"

  - it: a repo can override remote-control name/permissionMode/spawn/capacity independently of the chart default
    set:
      remoteControl:
        permissionMode: plan
        spawn: session
        capacity: 4
      repos:
        - org: myorg
          repo: myrepo
          remoteControl:
            name: custom-name
            capacity: 12
    asserts:
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_NAME
            value: "custom-name"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_PERMISSION_MODE
            value: "plan"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_SPAWN
            value: "session"
      - documentIndex: 1
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RC_CAPACITY
            value: "12"

  - it: fails when remoteControl.permissionMode is not a recognized value
    set:
      remoteControl:
        permissionMode: not-a-real-mode
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - failedTemplate:
          errorMessageRegex: "remoteControl.permissionMode must be one of"

  - it: fails when remoteControl.spawn is not a recognized value
    set:
      remoteControl:
        spawn: not-a-real-mode
      repos:
        - org: myorg
          repo: myrepo
    asserts:
      - failedTemplate:
          errorMessageRegex: "remoteControl.spawn must be one of"

  - it: fails when a repo's remoteControl.permissionMode override is not a recognized value
    set:
      repos:
        - org: myorg
          repo: myrepo
          remoteControl:
            permissionMode: not-a-real-mode
    asserts:
      - failedTemplate:
          errorMessageRegex: "repos\\[\\].remoteControl.permissionMode must be one of"
