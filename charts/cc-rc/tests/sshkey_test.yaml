suite: SSH key generation Job (happy path)
templates:
  - job-ssh-key.yaml
set:
  github.token: dummy-token
  git:
    name: CI Bot
    email: ci@example.com
  repos:
    - org: myorg
      repo: myrepo
tests:
  - it: renders a ServiceAccount, scoped Role/RoleBinding, and a pre-install/pre-upgrade hook Job
    asserts:
      - documentIndex: 0
        isKind:
          of: ServiceAccount
      - documentIndex: 0
        equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - documentIndex: 1
        isKind:
          of: Role
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["create"]
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["RELEASE-NAME-cc-rc-ssh-key"]
            verbs: ["get", "delete"]
      - documentIndex: 2
        isKind:
          of: RoleBinding
      - documentIndex: 3
        isKind:
          of: Job
      - documentIndex: 3
        equal:
          path: metadata.name
          value: RELEASE-NAME-cc-rc-ssh-key
      - documentIndex: 3
        equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - documentIndex: 3
        equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - documentIndex: 3
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-cc-rc-ssh-key
      - documentIndex: 3
        # component: ssh-key, not agent - never selected by the agent
        # NetworkPolicy, and never given the proxy env vars.
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: ssh-key
      - documentIndex: 3
        equal:
          path: spec.template.spec.containers[0].command
          value: ["/bin/bash", "/opt/cc-rc/scripts/create-ssh-key.sh"]
      - documentIndex: 3
        # No HTTP(S)_PROXY vars: NAMESPACE, SECRET_NAME, KEY_TITLE, GH_TOKEN only.
        lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 4
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-cc-rc-github-token
                key: token
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_NAME
            value: RELEASE-NAME-cc-rc-ssh-key

  - it: honors a custom secretName/keyTitle
    set:
      sshKey:
        secretName: custom-ssh-key
        keyTitle: my-org-bot
    asserts:
      - documentIndex: 1
        contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["custom-ssh-key"]
            verbs: ["get", "delete"]
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_NAME
            value: custom-ssh-key
      - documentIndex: 3
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEY_TITLE
            value: my-org-bot

  - it: renders nothing when sshKey.enabled is false
    set:
      sshKey.enabled: false
    asserts:
      - hasDocuments:
          count: 0
