name: Helm

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  helm:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install helm-unittest plugin
        # --verify=false works around helm-unittest not yet supporting Helm
        # v4's plugin verification: https://github.com/helm-unittest/helm-unittest/issues/777
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: helm lint
        run: |
          set -e
          for chart in charts/*/; do
            helm lint "$chart"
          done

      - name: helm unittest
        run: |
          set -e
          for chart in charts/*/; do
            helm unittest "$chart"
          done

      - name: Install helm-docs
        run: |
          set -e
          version=$(curl -fsSL https://api.github.com/repos/norwoodj/helm-docs/releases/latest | grep -m1 '"tag_name"' | cut -d '"' -f4 | sed 's/^v//')
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${version}/helm-docs_${version}_Linux_x86_64.tar.gz" | tar xz helm-docs
          sudo mv helm-docs /usr/local/bin/helm-docs

      - name: Run helm-docs
        run: helm-docs -c charts

      # main requires PRs (branch ruleset), so regenerated docs can't be
      # pushed directly even from a workflow. Open/update a PR instead.
      - name: Open PR with regenerated docs
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs: regenerate Helm chart README via helm-docs"
          title: "docs: regenerate Helm chart README via helm-docs"
          body: Automated update of Helm chart README.md file(s) via helm-docs, triggered by changes to charts/** on main.
          branch: chore/helm-docs-update
          base: main
          add-paths: "charts/**/README.md"
          delete-branch: true
